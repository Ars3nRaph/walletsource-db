version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: walletsource-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: walletsource
      POSTGRES_PASSWORD: walletsource_dev
      POSTGRES_DB: walletsource
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletsource"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - walletsource-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: walletsource-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@walletsource.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - walletsource-network

volumes:
  postgres_data:
    driver: local

networks:
  walletsource-network:
    driver: bridge
